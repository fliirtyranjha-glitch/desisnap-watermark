name: Watermark video

# Triggered by repository_dispatch from the DesiSnap worker. The payload
# carries two short-lived signed URLs (source download + destination upload)
# so this repository needs NO credentials at all.
on:
  repository_dispatch:
    types: [watermark]

permissions: {}

concurrency:
  group: wm-${{ github.event.client_payload.dstKey }}
  cancel-in-progress: false

jobs:
  watermark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest runner images no longer ship ffmpeg preinstalled.
      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Watermark + upload
        env:
          SRC_URL: ${{ github.event.client_payload.srcUrl }}
          DST_URL: ${{ github.event.client_payload.dstUrl }}
          LOGO_URL: ${{ github.event.client_payload.logoUrl }}
          SITE_NAME: ${{ github.event.client_payload.siteName }}
          SRC_EXT: ${{ github.event.client_payload.srcExt }}
          OUT_NAME: ${{ github.event.client_payload.name }}
          LOGO_POS: ${{ github.event.client_payload.logoPos }}
          LOGO_MOTION: ${{ github.event.client_payload.logoMotion }}
          TEXT_POS: ${{ github.event.client_payload.textPos }}
          TEXT_MOTION: ${{ github.event.client_payload.textMotion }}
          TEXT_STYLE: ${{ github.event.client_payload.textStyle }}
          TEXT_SIZE: ${{ github.event.client_payload.textSize }}
          OP: ${{ github.event.client_payload.op }}
          # New-style packed options (worker sends ONE pipe-packed string —
          # GitHub caps client_payload at 10 properties):
          OPTS: ${{ github.event.client_payload.opts }}
        run: bash scripts/watermark.sh
